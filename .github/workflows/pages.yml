name: Deploy digest preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: corepack enable && corepack prepare pnpm@10.28.1 --activate && pnpm install

      - name: Save digest page
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
          LANE_ID: lane-07
          PORT: 8787
        run: |
          set -euo pipefail
          pnpm start &
          pid=$!
          ready=0
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/health >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          mkdir -p site
          curl -sf http://127.0.0.1:8787/digest/2026-10-28 -o site/index.html
          grep -q 'digest 2026-10-28' site/index.html
          kill "$pid" || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
